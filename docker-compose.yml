services:
  db:
    image: postgres:16-alpine
    container_name: slot_allocation_db
    environment:
      POSTGRES_USER: slot
      POSTGRES_PASSWORD: slot
      POSTGRES_DB: slot_allocation
    ports:
      - "55432:5432"
    volumes:
      - slot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slot -d slot_allocation"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  slot_pgdata:
